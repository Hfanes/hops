name: CI

# Runs the same checks a merge to main relies on: the frontend type check and
# build, and the Rust format, lint and test checks. Windows only, because most
# of the backend is behind `cfg(target_os = "windows")` and the repository is
# public, so Windows runners cost nothing.
#
# Pull requests check the code merged with main, which is what the ruleset
# requires before merging. Pushes to main (every merge) check main again and
# keep its Rust cache warm, so new pull requests start from it.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # The PR merge commit and its first parent (the base), to list the
          # files the PR changes.
          fetch-depth: 2

      # The Rust steps take minutes, so they only run when the PR touches the
      # backend or this workflow. The job itself always runs, because a
      # required status check that never reports blocks the merge. Pushes to
      # main and manual runs always check Rust, which also refreshes the cache.
      - name: Detect Rust changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          rust=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            echo "Changed files:"
            echo "$changed"
            if ! grep -qE '^(src-tauri/|\.github/workflows/ci\.yml$)' <<< "$changed"; then
              rust=false
            fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "Rust checks: $rust" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Rust
        if: steps.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust cache
        if: steps.changes.outputs.rust == 'true'
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Type check and build frontend
        run: bun run build

      - name: Check Rust formatting
        if: steps.changes.outputs.rust == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        if: steps.changes.outputs.rust == 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        if: steps.changes.outputs.rust == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
