name: Version check

# Catches a half-done version bump before it reaches main, where it would
# trigger a release with mismatched versions.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check that all version declarations agree
        run: bash .github/scripts/check-version.sh
